[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctxcheck"
version = "0.1.0"
description = "A test kit and flight recorder for agent context-compaction policies"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
    "typer>=0.12",
    "httpx>=0.27",
    "tiktoken>=0.8",
]

[project.scripts]
ctxcheck = "ctxcheck.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ctxcheck"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "pyright>=1.1.389",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "standard"
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x --tb=short"
